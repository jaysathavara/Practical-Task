<article class="card mb-3 shadow-sm border rounded-3" [appHighlightOverdue]="task">
  <div class="card-body d-flex flex-wrap align-items-center justify-content-between gap-3">

    <div class="task-info flex-grow-1">
      <h5 class="fw-bold mb-1">
        {{ task.title }}
      </h5>

      <p class="text-secondary mb-0">
        {{ task.name }}, due {{ task.dueDate * 1000 | date:'MMM d, y' }}
      </p>
    </div>

    <span
      class="badge rounded-pill px-3 py-2"
      [ngClass]="{
        'bg-danger-subtle text-danger': task.priority === 'High',
        'bg-warning-subtle text-warning-emphasis': task.priority === 'Medium',
        'bg-success-subtle text-success': task.priority === 'Low'
      }">
      {{ task.priority }}
    </span>

    <select
      class="form-select w-auto"
        [(ngModel)]="task.status"

      (change)="onStatusChange($event)"
      aria-label="Change status">

      @for (s of statuses; track s) {
        <option [value]="s">{{ s }}</option>
      }
    </select>

    <div class="d-flex gap-2">
      <button
        type="button"
        class="btn btn-outline-secondary btn-sm px-3"
        (click)="onEdit()">
        Edit
      </button>

      <button
        type="button"
        class="btn btn-outline-danger btn-sm px-3"
        (click)="onDelete(task.id)">
        Delete
      </button>
    </div>

  </div>
</article>
