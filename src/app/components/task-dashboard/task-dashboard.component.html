<div class="container mt-4">
    <div class="page-head d-flex align-items-center justify-content-between">
        <h2>Task Dashboard</h2>
        <button type="button" class="btn btn-primary" (click)="openAddTask()">Add Task</button>
    </div>
    <div class="search-filters d-flex align-items-center justify-content-between mt-3">
        <div class="search-box d-flex align-items-center">
            <input type="text" class="form-control" placeholder="Search tasks..." [formControl]="searchBox">
            <button class="btn btn-secondary ml-2">Search</button>
        </div>
        <div class="filter-box d-flex align-items-center">
            <label for="statusFilter" class="mr-2">Filter by Status:</label>
            <select id="statusFilter" class="form-control" [(ngModel)]="selectedStatus" (change)="onFilterStatus()">
                <option [ngValue]="''">All</option>
                <option [ngValue]="'Todo'">Todo</option>
                <option [ngValue]="'In Progress'">In Progress</option>
                <option [ngValue]="'Done'">Done</option>
            </select>
        </div>
                <div class="filter-box d-flex align-items-center">
            <label for="statusFilter" class="mr-2">Filter by Priority:</label>
            <select id="statusFilter" class="form-control" [(ngModel)]="selectedPriority" (change)="onFilterPriority()">
                <option [ngValue]="''">All</option>
                <option [ngValue]="'High'">High</option>
                <option [ngValue]="'Medium'">Medium</option>
                <option [ngValue]="'Low'">Low</option>
            </select>
        </div>

    </div>

  <div class="task-list mt-4 ">
    <app-taskcard
      *ngFor="let task of tasks"
      [task]="task"
      (edit)="openEditTask($event)"
      (statusChange)="onStatusChange($event)"
      (delete)="onDelete($event)">
    </app-taskcard>
  </div>

  <app-task-form
    [isOpen]="isTaskFormOpen"
    [task]="selectedTask"
    [saveError]="taskSaveError"
    (save)="saveTask($event)"
    (cancel)="closeTaskForm()">
  </app-task-form>
</div>
